name: Aggiorna dati Fantacalcio

on:
  schedule:
    # Ogni giorno alle 6:00 UTC (le quotazioni/statistiche cambiano poco
    # più spesso di così: puoi aumentare la frequenza durante l'asta,
    # es. '0 */2 * * *' per ogni 2 ore).
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # permette anche di lanciarlo a mano da GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Scarica i dati da fantacalcio.it
        run: python scripts/fetch_fantacalcio_data.py

      - name: Committa se qualcosa è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quotazioni.csv data/stats_curr.csv data/stats_prev.csv data/indisponibili.csv
          git diff --cached --quiet || git commit -m "Aggiorna dati fantacalcio.it [skip ci]"
          git push
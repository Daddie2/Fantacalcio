name: Aggiorna dati Fantacalcio

on:
  schedule:
    # Ogni giorno alle 6:00 UTC: quotazioni, statistiche, indisponibili
    - cron: '0 6 * * *'
    # Venerdì, sabato e domenica ogni 3 ore (8-17 UTC): aggiorna le probabili formazioni
    - cron: '0 8,11,14,17 * * 5,6,0'
  workflow_dispatch: {}   # permette anche di lanciarlo a mano da GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Scarica i file da fantacalcio.it
        run: python scripts/scrape_fantacalcio.py

      - name: Scarica probabili formazioni da Gazzetta
        run: python scripts/fetch_formazioni.py
        continue-on-error: true   # se Gazzetta blocca o cambia pagina, il resto non si ferma

      - name: Salva gli HTML di debug (scaricabili dalla pagina del run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug_*.html
          if-no-files-found: ignore

      - name: Committa se qualcosa è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "Aggiorna dati fantacalcio [skip ci]"
          git push

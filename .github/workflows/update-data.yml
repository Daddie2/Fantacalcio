name: Aggiorna dati Fantacalcio

on:
  schedule:
    # Ogni notte alle 23:00 UTC: quotazioni, statistiche, indisponibili, PianetaFanta e formazioni
    - cron: '0 23 * * *'
    # Venerdi, sabato e domenica ogni 3 ore (8-17 UTC): solo le probabili formazioni di Gazzetta
    - cron: '0 8,11,14,17 * * 5,6,0'
  workflow_dispatch: {}   # lancio manuale (anche dal pulsante dell'app): esegue tutto

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Scarica quotazioni e voti da fantacalcio.it
        if: github.event.schedule != '0 8,11,14,17 * * 5,6,0'
        run: python scripts/scrape_fantacalcio.py

      - name: Scarica dati avanzati da PianetaFanta
        if: github.event.schedule != '0 8,11,14,17 * * 5,6,0'
        run: python scripts/scrape_pianetafanta.py
        continue-on-error: true   # se PianetaFanta blocca, il resto continua

      - name: Scarica probabili formazioni da Gazzetta
        run: python scripts/fetch_formazioni.py
        continue-on-error: true   # se Gazzetta blocca o cambia pagina, il resto non si ferma

      - name: Salva gli HTML di debug (scaricabili dalla pagina del run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug_*.html
          if-no-files-found: ignore

      - name: Committa se qualcosa e cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "Aggiorna dati fantacalcio [skip ci]"
          git push

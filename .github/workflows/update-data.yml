name: Aggiorna dati Fantacalcio

on:
  schedule:
    # Ogni notte alle 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch: {}   # Questo permette al pulsante HTML di farlo partire manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Scarica quotazioni e voti da fantacalcio.it
        run: python scripts/scrape_fantacalcio.py

      - name: Scarica dati avanzati da PianetaFanta
        run: python scripts/scrape_pianetafanta.py
        continue-on-error: true   # Se PianetaFanta blocca, il resto continua

      - name: Salva gli HTML di debug (scaricabili dalla pagina del run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug_*.html
          if-no-files-found: ignore

      - name: Committa se qualcosa è cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "Aggiorna dati fantacalcio [skip ci]"
          git push

name: Aggiorna dati Fantacalcio

on:
  schedule:
    # Ogni notte alle 23:00 UTC: quotazioni, statistiche, indisponibili, PianetaFanta e formazioni
    - cron: '0 23 * * *'
    # Venerdi, sabato e domenica ogni 3 ore (8-17 UTC): solo le probabili formazioni di Gazzetta
    - cron: '0 8,11,14,17 * * 5,6,0'
  workflow_dispatch: {}   # lancio manuale (anche dal pulsante dell'app): esegue tutto

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Scarica quotazioni, indisponibili e voti da fantacalcio.it
        id: fc
        if: github.event.schedule != '0 8,11,14,17 * * 5,6,0'
        run: python scripts/scrape_fantacalcio.py
        # Anche se questo step fallisce, gli step dopo (PianetaFanta, formazioni
        # e soprattutto il COMMIT) devono girare: i CSV scaricati con successo
        # vanno salvati comunque. Il run viene poi segnato rosso dall'ultimo step.
        continue-on-error: true

      - name: Scarica dati avanzati da PianetaFanta
        if: github.event.schedule != '0 8,11,14,17 * * 5,6,0'
        run: python scripts/scrape_pianetafanta.py
        continue-on-error: true   # se PianetaFanta blocca, il resto continua
        timeout-minutes: 15
        env:
          PF_WORKERS: "6"         # scendi a 3-4 se compaiono molti 429
          PF_DELAY: "0.3"

      - name: Scarica probabili formazioni da Gazzetta
        run: python scripts/fetch_formazioni.py
        continue-on-error: true   # se Gazzetta blocca o cambia pagina, il resto non si ferma

      - name: Salva gli HTML di debug (scaricabili dalla pagina del run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug_*.html
          if-no-files-found: ignore

      - name: Committa se qualcosa e cambiato
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git add data/slugs.txt 2>/dev/null || true   # cache slug PianetaFanta (puo' non esistere ancora)
          if git diff --cached --quiet; then
            echo "Nessuna modifica"; exit 0
          fi
          git commit -m "Aggiorna dati fantacalcio [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push fallito, riprovo ($i/3)..."; sleep 5
          done
          exit 1

      # Dopo il commit: se lo scraper di fantacalcio.it ha avuto problemi il run
      # risulta rosso (e GitHub ti manda la mail) invece di passare inosservato.
      - name: Segnala errori dello scraper fantacalcio.it
        if: ${{ !cancelled() && steps.fc.outcome == 'failure' }}
        run: |
          echo "::error::Lo scraper di fantacalcio.it ha avuto errori: apri il log dello step 'Scarica quotazioni, indisponibili e voti' per i dettagli."
          exit 1
